# Receta para GitHub Actions: cada 30 minutos recolecta noticias y publica la página.
# Va en el repositorio en la ruta:  .github/workflows/actualizar.yml

name: Actualizar noticias

on:
  schedule:
    - cron: "7,37 * * * *"   # minutos 7 y 37 de cada hora (UTC); evita la congestión de la hora en punto
    - cron: "23 12 1 * *"    # día 1 de cada mes: registra actividad (ver "mantener-activo")
  workflow_dispatch:          # permite correrlo a mano desde la pestaña "Actions"
  push:
    branches: [main]          # y cada vez que cambies algún archivo del repositorio

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # si una corrida sigue en curso, la siguiente espera
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar feedparser
        run: pip install feedparser

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Recuperar las noticias ya publicadas
        run: |
          curl -fsSL "${{ steps.pages.outputs.base_url }}/noticias.json" -o anterior.json || true
          python exportar.py --importar anterior.json

      - name: Recolectar noticias nuevas
        run: python recolector.py

      - name: Armar la página
        run: |
          python exportar.py --salida sitio/noticias.json
          cp index.html sitio/

      - name: Subir la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4

  # GitHub pausa las tareas programadas de los repositorios que pasan 60 días
  # sin cambios. Una vez por mes este paso actualiza un archivo de control,
  # así el repositorio figura como activo y la app nunca deja de actualizarse.
  mantener-activo:
    if: github.event.schedule == '23 12 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar actividad mensual
        run: |
          date -u +"Ultima actividad automatica: %Y-%m-%d %H:%M UTC" > actividad.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actividad.txt
          git commit -m "Actividad mensual automática" || echo "Sin cambios"
          git push
